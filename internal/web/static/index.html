<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AX</title>
<script src="marked.min.js"></script>
<link rel="stylesheet" href="github-dark.min.css">
<script src="highlight.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#111;--card:#1a1a1a;--border:#2a2a2a;--text:#fff;--text2:#9e9e9e;--primary:#7aa2f7;--green:#9ece6a;--red:#f7768e;--purple:#bb9af7;--user-bg:#1e3a5f;--user-text:#fff;--active-bg:#283457;--active-text:#7aa2f7}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .2s,min-width .2s}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden;border-right:none}
.collapse-btn{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:4px 8px}
.collapse-btn:hover{color:var(--text)}
.expand-btn{background:none;border:none;color:var(--text2);font-size:14px;cursor:pointer;padding:4px 8px}
.expand-btn:hover{color:var(--primary)}
.sidebar-hdr{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sidebar-hdr h2{font-size:14px;color:var(--primary)}
.new-btn{background:var(--primary);color:#000;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.conv-list{flex:1;overflow-y:auto;padding:8px}
.conv-item{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between}
.conv-title{overflow:hidden;text-overflow:ellipsis;flex:1}
.conv-del{display:none;background:none;border:none;color:var(--text2);font-size:14px;cursor:pointer;padding:0 4px;flex-shrink:0}
.conv-del:hover{color:var(--red)}
.conv-item:hover .conv-del{display:block}
.conv-item:hover{background:var(--card)}
.conv-item.active{background:var(--active-bg);color:var(--active-text)}
.main{flex:1;display:flex;flex-direction:column}
.main-hdr{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.main-hdr .title{font-size:14px;font-weight:600;color:var(--primary)}
.model-sel{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:12px}
.hdr-btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;width:32px;height:32px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hdr-btn:hover{border-color:var(--primary);color:var(--primary)}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg-wrap{display:flex;flex-direction:column;max-width:80%;gap:2px}
.msg-wrap.user-wrap{align-self:flex-end}
.msg-wrap.asst-wrap{align-self:flex-start}
.msg{padding:10px 14px;font-size:14px;line-height:1.6;border-radius:10px;word-wrap:break-word}
.msg-user{background:var(--user-bg);color:var(--user-text);border-radius:10px 10px 2px 10px}
.msg-assistant{background:var(--surface);border-radius:10px 10px 10px 2px}
.msg-assistant pre{background:#000;border-radius:6px;padding:10px;overflow-x:auto;margin:8px 0;position:relative}
.msg-assistant pre .copy-btn{position:absolute;top:6px;right:6px;background:var(--card);border:1px solid var(--border);color:var(--text2);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s}
.msg-assistant pre:hover .copy-btn{opacity:1}
.msg-assistant pre .copy-btn:hover{color:var(--text)}
.msg-assistant code{font-family:'JetBrains Mono',monospace;font-size:13px}
.msg-assistant p{margin:4px 0}
.msg-actions{display:flex;gap:4px;flex-wrap:wrap}
.msg-act{background:none;border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer}
.msg-act:hover{color:var(--text);border-color:var(--text2)}
.tool-strip{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.tool-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:11px;font-family:monospace;border:1px solid var(--border);color:var(--text2);cursor:pointer;position:relative}
.tool-chip.running{border-color:var(--primary);color:var(--primary)}
.tool-chip.done{border-color:var(--green);color:var(--green)}
.tool-chip.error{border-color:var(--red);color:var(--red)}
.tool-detail{display:none;position:absolute;left:0;top:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:11px;max-height:160px;overflow-y:auto;white-space:pre-wrap;z-index:10;width:300px;margin-top:4px}
.tool-detail.open{display:block}
.reasoning{margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.reasoning summary{padding:8px 12px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.reasoning.active summary{color:var(--primary)}
.reasoning .reasoning-text{padding:4px 12px 10px;font-size:13px;color:var(--text2);line-height:1.5;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.reasoning.active summary::after{content:'';display:inline-block;width:40px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--border),var(--primary),var(--border));background-size:200% 100%;animation:shimmer 1.5s infinite}
.input-area{border-top:1px solid var(--border);padding:12px 16px}
.send-btn{background:var(--primary);color:#000;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.send-btn svg{width:16px;height:16px}
.send-btn:disabled{opacity:.3}
.send-btn.streaming{background:var(--red);color:#fff}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.edit-area{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:14px;font-family:inherit;resize:vertical;margin-top:6px}
.edit-btns{display:flex;gap:6px;margin-top:6px}
.edit-btns button{padding:4px 12px;border-radius:6px;border:none;font-size:12px;cursor:pointer}
.edit-btns .save{background:var(--primary);color:#000}
.edit-btns .cancel{background:var(--card);color:var(--text2);border:1px solid var(--border)}
.mode-pills{display:flex;gap:4px;margin-bottom:8px}
.mode-pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;background:var(--card);color:var(--text2);border:1px solid var(--border)}
.mode-pill.active{background:#283457;color:var(--primary);border-color:var(--primary)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 14px;resize:none;font-size:14px;font-family:inherit;min-height:44px;max-height:160px}
.input-row textarea:focus{border-color:var(--primary);outline:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:90%;max-width:500px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-hdr h3{font-size:15px;color:var(--primary)}
.modal-tabs{display:flex;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--card)}
.modal-tab{padding:8px 12px;font-size:12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}
.modal-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.modal-tab:hover{color:var(--text)}
.modal-close{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer}
.modal-body{flex:1;overflow-y:auto;padding:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.field input{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
.field input:focus{border-color:var(--primary);outline:none}
.btn-primary{background:var(--primary);color:#000;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
[data-theme="light"]{--bg:#fafafa;--surface:#fff;--card:#f0f0f0;--border:#d0d0d0;--text:#1a1a1a;--text2:#4a4a4a;--primary:#005a9e;--green:#1a6e00;--red:#b91c1c;--purple:#6b21a8;--user-bg:#005a9e;--user-text:#fff;--active-bg:#d0e8ff;--active-text:#005a9e}
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh;width:100%}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;width:320px}
.login-box h2{font-size:1.2rem;color:var(--primary);text-align:center;margin-bottom:1rem}
.login-box input{width:100%;padding:.75rem;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:1rem;margin-bottom:1rem}
.login-box button{width:100%;padding:.75rem;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:1rem;cursor:pointer}
.login-err{color:var(--red);font-size:.85rem;margin-bottom:.5rem;display:none}
.agent-panel{width:300px;background:var(--surface);border-left:1px solid var(--border);display:none;flex-direction:column;flex-shrink:0;overflow:hidden}
.agent-panel.open{display:flex}
.agent-panel-hdr{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.agent-tabs{display:flex;border-bottom:1px solid var(--border)}
.agent-tab{padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent}
.agent-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.agent-tab:hover{color:var(--text)}
.agent-panel-body{flex:1;overflow-y:auto;padding:10px;font-size:13px}
.task-item{padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px}
.task-item .task-name{font-weight:500;font-size:12px}
.task-item .task-status{font-size:11px;color:var(--text2)}
.task-item .task-status.running{color:var(--primary)}
.task-item .task-status.done{color:var(--green)}
.task-item .task-status.error{color:var(--red)}
.roster-item{padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.roster-item .roster-name{font-weight:500;font-size:13px}
.roster-item .roster-desc{font-size:11px;color:var(--text2)}
@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:100;transition:left .2s;width:260px}
  .sidebar.open{left:0}
  .msg-wrap{max-width:95%}
  .menu-btn{display:block!important}
}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-hdr"><button class="new-btn" onclick="newChat()">+ New</button><button class="collapse-btn" onclick="collapseSidebar()">«</button></div>
  <div class="conv-list" id="convList"></div>
</div>
<div class="main">
  <div class="main-hdr">
    <span class="title" id="title"><button class="msg-act menu-btn" onclick="toggleSidebar()" style="display:none;margin-right:8px;font-size:16px;padding:4px 8px">☰</button><button class="expand-btn" id="expandBtn" onclick="expandSidebar()" style="display:none">»</button>AX<span id="activeModel" style="color:var(--text2);font-weight:400;font-size:12px"></span></span>
    <div style="display:flex;gap:6px;align-items:center"><button class="hdr-btn" onclick="toggleAgentPanel()" title="Agents">A</button><button class="hdr-btn" onclick="toggleTheme()" title="Toggle theme">◐</button><button class="hdr-btn" onclick="openSettings()" title="Settings">⚙</button></div>
    <select class="model-sel" id="modelSel" style="display:none"></select>
  </div>
  <div class="messages" id="messages"><div class="empty">Send a message to start</div></div>
  <div class="input-area">
    <div class="mode-pills"><span class="mode-pill active" onclick="setMode('chat',this)">CHAT</span><span class="mode-pill" onclick="setMode('plan',this)">PLAN</span><span class="mode-pill" onclick="setMode('build',this)">BUILD</span></div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Message..." onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>
</div>
<div class="agent-panel" id="agentPanel">
  <div class="agent-panel-hdr"><span style="font-weight:600;font-size:13px">Agents</span><button class="collapse-btn" onclick="toggleAgentPanel()">»</button></div>
  <div class="agent-tabs"><span class="agent-tab active" onclick="agentTab('monitor',this)">Monitor</span><span class="agent-tab" onclick="agentTab('spawn',this)">Spawn</span><span class="agent-tab" onclick="agentTab('roster',this)">Roster</span></div>
  <div class="agent-panel-body" id="agentBody"></div>
</div>
<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-hdr"><h3>Settings</h3><button class="modal-close" onclick="closeSettings()">×</button></div>
    <div class="modal-tabs">
      <div class="modal-tab active" onclick="settingsTab('providers')">Providers</div>
      <div class="modal-tab" onclick="settingsTab('agent')">Agent</div>
      <div class="modal-tab" onclick="settingsTab('tools')">Tools</div>
      <div class="modal-tab" onclick="settingsTab('theme')">Theme</div>
    </div>
    <div class="modal-body" id="settingsBody"></div>
  </div>
</div>
<script>
var ws,convId='',streaming=false,streamEl=null;
var msgs=document.getElementById('messages'),input=document.getElementById('input');

function connect(){
  var url='ws://'+location.host+'/ws';
  if(authToken)url+='?token='+authToken;
  ws=new WebSocket(url);
  ws.onmessage=function(e){handle(JSON.parse(e.data))};
  ws.onclose=function(){setTimeout(connect,2000)};
}

function handle(d){
  switch(d.type){
    case 'conversation.created':
      convId=d.conversation.id;
      loadConversations();
      break;
    case 'stream.start':
      streamEl=addMsg('assistant','');
      streamEl.dataset.raw='';
      streamEl.dataset.reasoning='';
      break;
    case 'stream.delta':
      if(streamEl){streamEl.dataset.raw+=d.delta;renderStream()}
      break;
    case 'stream.reasoning':
      if(streamEl){streamEl.dataset.reasoning+=d.delta;renderStream()}
      break;
    case 'stream.tool_call':
      var strip=document.getElementById('tool-strip-active');
      if(!strip){strip=document.createElement('div');strip.className='tool-strip';strip.id='tool-strip-active';if(streamEl)streamEl.parentNode.insertBefore(strip,streamEl)}
      var chip=document.createElement('span');
      chip.className='tool-chip running';chip.id='tc-'+d.toolCall.id;
      chip.textContent=d.toolCall.name;
      chip.onclick=function(){var det=this.querySelector('.tool-detail');if(det)det.classList.toggle('open')};
      strip.appendChild(chip);
      break;
    case 'stream.tool_result':
      var tcel=document.getElementById('tc-'+d.toolCallId);
      if(tcel){
        tcel.className='tool-chip '+(d.isError?'error':'done');
        var det=document.createElement('div');det.className='tool-detail';det.textContent=d.result;
        tcel.appendChild(det);
      }
      break;
    case 'stream.end':
      streaming=false;
      if(streamEl&&streamEl.dataset.reasoning){
        var r=streamEl.querySelector('.reasoning');
        if(r){r.className='reasoning';r.removeAttribute('open');r.querySelector('summary').textContent='Thought'}
      }
      // Add actions to completed message
      if(streamEl&&streamEl.dataset.raw){
        var acts=document.createElement('div');acts.className='msg-actions';
        acts.innerHTML='<button class="msg-act" onclick="copyMsg(this)">Copy</button><button class="msg-act" onclick="retryMsg()">Retry</button>';
        streamEl.parentNode.appendChild(acts);
      }
      streamEl=null;
      var activeStrip=document.getElementById('tool-strip-active');
      if(activeStrip)activeStrip.removeAttribute('id');
      document.getElementById('sendBtn').className='send-btn';document.getElementById('sendBtn').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
      if(typeof hljs!=='undefined')hljs.highlightAll();
      addCopyButtons();
      break;
    case 'agent.event':
      if(viewingTaskId===d.taskId)appendTaskEvent(d.event);
      break;
    case 'agent.status':
      if(viewingTaskId===d.taskId){var el=document.getElementById('taskLog');if(el){var div=document.createElement('div');div.style.cssText='margin-top:8px;padding:6px;border:1px solid var(--border);border-radius:4px;font-weight:500';div.textContent='Status: '+d.status;el.appendChild(div)}}
      break;
    case 'stream.error':
      addMsg('system',d.error);streaming=false;streamEl=null;
      document.getElementById('sendBtn').className='send-btn';document.getElementById('sendBtn').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
      break;
  }
  msgs.scrollTop=msgs.scrollHeight;
}

var streamRaf=0;
function renderStream(){
  if(streamRaf)return;
  var delay=(streamEl&&streamEl.dataset.raw.length>2000)?200:16;
  streamRaf=setTimeout(function(){
    streamRaf=0;
    if(!streamEl)return;
    var html='';
    if(streamEl.dataset.reasoning){
      html+='<details class="reasoning active" open><summary>Thinking...</summary><div class="reasoning-text">'+escHtml(streamEl.dataset.reasoning)+'</div></details>';
    }
    if(streamEl.dataset.raw){
      html+=marked.parse(streamEl.dataset.raw);
    }
    streamEl.innerHTML=html;
    msgs.scrollTop=msgs.scrollHeight;
  },delay);
}

function addMsg(role,content){
  document.querySelector('.empty')?.remove();
  var wrap=document.createElement('div');
  wrap.className='msg-wrap '+(role==='user'?'user-wrap':'asst-wrap');
  var div=document.createElement('div');
  div.className='msg msg-'+role;
  div.innerHTML=role==='user'?escHtml(content):marked.parse(content);
  if(role!=='user')div.dataset.raw=content;
  wrap.appendChild(div);
  if(content&&role==='user'){
    var acts=document.createElement('div');acts.className='msg-actions';
    acts.innerHTML='<button class="msg-act" onclick="copyMsg(this)">Copy</button><button class="msg-act" onclick="editMsg(this)">Edit</button>';
    wrap.appendChild(acts);
  }
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
  return div;
}

function send(){
  if(streaming){ws.send(JSON.stringify({type:'chat.cancel',conversationId:convId}));return}
  var text=input.value.trim();if(!text&&!pendingImages.length)return;
  addMsg('user',text||(pendingImages.length+' image(s)'));
  var payload={type:'chat.send',conversationId:convId,content:text,mode:mode};
  if(pendingImages.length){payload.images=pendingImages;pendingImages=[];updateImagePreview()}
  ws.send(JSON.stringify(payload));
  input.value='';input.style.height='44px';
  streaming=true;
  var btn=document.getElementById('sendBtn');
  btn.className='send-btn streaming';
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
}

function newChat(){convId='';msgs.innerHTML='<div class="empty">Send a message to start</div>';document.getElementById('title').textContent='AX'}
function handleKey(e){if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();send()}}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px'}
function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function copyMsg(btn){
  var msg=btn.closest('.msg-wrap').querySelector('.msg');
  var text=msg.dataset.raw||msg.textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(text);
  btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy'},1500);
}
function editMsg(btn){
  var wrap=btn.closest('.msg-wrap');
  var msg=wrap.querySelector('.msg');
  var text=msg.dataset.raw||msg.textContent;
  wrap.innerHTML='<textarea class="edit-area">'+escHtml(text)+'</textarea><div class="edit-btns"><button class="save" onclick="submitEdit(this)">Send</button><button class="cancel" onclick="loadConv(convId)">Cancel</button></div>';
  wrap.querySelector('.edit-area').focus();
}
function submitEdit(btn){
  var text=btn.closest('.msg-wrap').querySelector('.edit-area')?.value;
  if(!text||streaming)return;
  addMsg('user',text);
  ws.send(JSON.stringify({type:'chat.send',conversationId:convId,content:text,mode:mode}));
  streaming=true;document.getElementById('sendBtn').className='send-btn streaming';
}
function retryMsg(){
  if(streaming||!convId)return;
  ws.send(JSON.stringify({type:'chat.regenerate',conversationId:convId}));
}

async function loadConversations(){
  var r=await fetch('/api/conversations',{headers:authHeaders()});var data=await r.json();
  var list=document.getElementById('convList');
  list.innerHTML=data.map(function(c){return '<div class="conv-item'+(c.id===convId?' active':'')+'" onclick="loadConv(\''+c.id+'\')" ondblclick="event.stopPropagation();renameConv(\''+c.id+'\')"><span class="conv-title">'+escHtml(c.title||'Untitled')+'</span><button class="conv-del" onclick="event.stopPropagation();deleteConv(\''+c.id+'\')">×</button></div>'}).join('');
}
async function loadConv(id){
  convId=id;
  var r=await fetch('/api/conversations/'+id+'/messages',{headers:authHeaders()});var data=await r.json();
  msgs.innerHTML='';
  data.forEach(function(m){if(m.role==='user'||m.role==='assistant')addMsg(m.role,m.content)});
  loadConversations();
}
async function loadModels(){

// Image paste/drop support
function setupImageInput(){
  var inputEl=document.getElementById('input');
  inputEl.addEventListener('paste',function(e){
    var items=e.clipboardData?.items;
    if(!items)return;
    for(var i=0;i<items.length;i++){
      if(items[i].type.indexOf('image')!==-1){
        var file=items[i].getAsFile();
        attachImage(file);
        e.preventDefault();
        break;
      }
    }
  });
  inputEl.addEventListener('dragover',function(e){e.preventDefault()});
  inputEl.addEventListener('drop',function(e){
    e.preventDefault();
    var files=e.dataTransfer?.files;
    if(!files)return;
    for(var i=0;i<files.length;i++){
      if(files[i].type.indexOf('image')!==-1)attachImage(files[i]);
    }
  });
}
var pendingImages=[];
function attachImage(file){
  var reader=new FileReader();
  reader.onload=function(){
    pendingImages.push(reader.result);
    updateImagePreview();
  };
  reader.readAsDataURL(file);
}
function updateImagePreview(){
  var preview=document.getElementById('imagePreview');
  if(!preview){
    preview=document.createElement('div');
    preview.id='imagePreview';
    preview.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px';
    document.querySelector('.mode-pills').after(preview);
  }
  preview.innerHTML=pendingImages.map(function(src,i){
    return '<div style="position:relative"><img src="'+src+'" style="height:48px;border-radius:4px"><button style="position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;line-height:16px" onclick="removeImage('+i+')">x</button></div>';
  }).join('');
  preview.style.display=pendingImages.length?'flex':'none';
}
function removeImage(i){pendingImages.splice(i,1);updateImagePreview()}

if(localStorage.getItem('ax_theme')==='light')document.documentElement.setAttribute('data-theme','light');

connect();setupImageInput();checkAuth().then(function(ok){if(ok){loadConversations();loadModels()}});
